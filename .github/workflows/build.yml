name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Release)
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE ^
             main.cpp ^
             /Fe:charger.exe ^
             /link /SUBSYSTEM:CONSOLE ^
             netapi32.lib shell32.lib ole32.lib advapi32.lib user32.lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: charger-x64
          path: charger.exe
          if-no-files-found: error
